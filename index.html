<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Gerenciamento de Carros</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        // Configuração de cores do Tailwind
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#0d9488', // Teal
                        'secondary': '#475569', // Slate
                        'success': '#10b981', // Emerald
                        'danger': '#ef4444', // Red
                        'warning': '#f59e0b', // Amber
                        'info': '#38bdf8', // Sky
                        'background-light': '#f8fafc',
                    },
                }
            }
        }
    </script>
    <style>
        .h-32 { height: 8rem; }
        .overflow-x-auto::-webkit-scrollbar { height: 8px; }
        .overflow-x-auto::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-background-light min-h-screen text-slate-800">

    <div id="app" class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        
        <nav class="bg-white shadow-lg rounded-lg mb-8 p-4 flex flex-col sm:flex-row justify-between items-center space-y-4 sm:space-y-0 border-b-4 border-primary">
            <h1 class="text-3xl font-extrabold text-slate-800">Gerenciamento de Frota</h1>
            <div class="flex flex-wrap gap-3">
                <button onclick="router('acessorios')" class="nav-button bg-primary hover:bg-teal-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-150 shadow-md">Acessórios</button>
                <button onclick="router('carros')" class="nav-button bg-secondary hover:bg-slate-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-150 shadow-md">Carros</button>
                <button onclick="router('fabricantes')" class="nav-button bg-secondary hover:bg-slate-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-150 shadow-md">Fabricantes</button>
            </div>
        </nav>

        <main id="content" class="bg-white p-6 rounded-lg shadow-xl min-h-[60vh]">
            <div class="text-center text-slate-500 mt-20">
                Carregando aplicação...
            </div>
        </main>

        <div id="custom-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 p-4">
            <div class="bg-white rounded-xl p-6 shadow-2xl w-full max-w-md">
                <h3 id="modal-title" class="text-xl font-bold mb-4 text-slate-800">Título</h3>
                <p id="modal-body" class="mb-6 text-slate-600">Corpo da mensagem.</p>
                <div id="modal-actions" class="flex justify-end space-x-3">
                    <button id="modal-cancel" class="py-2 px-4 bg-gray-300 text-slate-800 rounded-lg hover:bg-gray-400 transition font-medium">Cancelar</button>
                    <button id="modal-confirm" class="py-2 px-4 bg-danger text-white rounded-lg hover:bg-red-600 transition font-medium">Confirmar</button>
                </div>
            </div>
        </div>

        <div id="toast-container" class="fixed bottom-5 right-5 z-50 space-y-2"></div>
    </div>

    <script>
        // --- 1. CONFIGURAÇÕES GLOBAIS ---
        const API_BASE_URL = 'https://api-gerenciamentocarro-final.onrender.com/api/v1';
        const MAX_RETRIES = 1; 
        
        const state = {
            currentView: '',
            mode: 'list',
            data: null,
            entityId: null,
            currentPage: 0,
            totalPages: 1,
            carros: [], // Cache para selects
            fabricantes: [], // Cache para selects
            search: {
                acessorios: { q: '', sort: 'id', direction: 'asc' },
                carros: { q: '', sort: 'id', direction: 'asc' },
                fabricantes: { q: '', sort: 'id', direction: 'asc' }
            }
        };

        // --- 2. UTILITÁRIOS ---
        
        // Formata data para input HTML (yyyy-MM-dd)
        function formatDateForInput(dateString) {
            if (!dateString) return '';
            return dateString.split('T')[0];
        }

        // --- 3. SERVIÇO DE API ---
        async function apiFetch(url, options = {}, retries = 0) {
            try {
                const response = await fetch(url, options);

                // Tratamento para DELETE bem sucedido (sem conteúdo)
                if (response.status === 204) return null;

                const contentType = response.headers.get("content-type");
                let data = null;

                if (contentType && contentType.indexOf("application/json") !== -1) {
                    data = await response.json();
                } else if (contentType && contentType.indexOf("text/plain") !== -1) {
                    data = await response.text();
                }

                if (!response.ok) {
                    if (response.status === 409) {
                        throw new Error("Não é possível excluir: Este item está vinculado a outros registros.");
                    }
                    throw new Error(data?.message || (typeof data === 'string' ? data : response.statusText) || "Erro na requisição");
                }
                return data;

            } catch (error) {
                console.error("Erro API:", error);
                if (retries < MAX_RETRIES && options.method !== 'DELETE') {
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    return apiFetch(url, options, retries + 1);
                }
                throw error;
            }
        }

        // --- 4. INTERFACE (UI) ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const colors = { success: 'bg-success', danger: 'bg-danger', warning: 'bg-warning', info: 'bg-info' };
            
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-lg shadow-2xl text-white font-semibold ${colors[type]} mb-2 transition-all duration-500`;
            toast.textContent = message;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 500);
            }, 4000);
        }

        function showConfirmationModal(title, body, onConfirm) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').textContent = body;
            
            const confirmBtn = document.getElementById('modal-confirm');
            const cancelBtn = document.getElementById('modal-cancel');

            // Clona para remover eventos antigos
            const newConfirm = confirmBtn.cloneNode(true);
            const newCancel = cancelBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
            cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);

            newConfirm.onclick = () => {
                modal.classList.add('hidden');
                onConfirm();
            };
            newCancel.onclick = () => modal.classList.add('hidden');
            modal.classList.remove('hidden');
        }

        // --- 5. NAVEGAÇÃO ---
        function router(view, mode = 'list', id = null, page = 0) {
            state.currentView = view;
            state.mode = mode;
            state.entityId = id;
            state.currentPage = page;

            // Atualiza botões do menu
            document.querySelectorAll('.nav-button').forEach(btn => {
                if (btn.getAttribute('onclick').includes(`'${view}'`)) {
                    btn.classList.remove('bg-secondary', 'hover:bg-slate-700');
                    btn.classList.add('bg-primary', 'hover:bg-teal-700');
                } else {
                    btn.classList.add('bg-secondary', 'hover:bg-slate-700');
                    btn.classList.remove('bg-primary', 'hover:bg-teal-700');
                }
            });

            switch (view) {
                case 'acessorios':
                    mode === 'list' ? renderAcessoriosList(page) : renderAcessorioForm();
                    break;
                case 'carros':
                    mode === 'list' ? renderCarrosList(page) : renderCarroForm();
                    break;
                case 'fabricantes':
                    mode === 'list' ? renderFabricantesList(page) : renderFabricanteForm();
                    break;
            }
        }

        function renderPagination(containerId, viewName, totalPages, currentPage) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';

            if (totalPages <= 1) return;

            const createBtn = (page, text) => {
                const btn = document.createElement('button');
                btn.textContent = text;
                btn.className = `py-2 px-4 rounded font-bold mx-1 ${page === currentPage ? 'bg-primary text-white' : 'bg-gray-200 text-slate-700 hover:bg-gray-300'}`;
                btn.onclick = () => {
                    if (viewName === 'acessorios') fetchAcessorios(page);
                    if (viewName === 'carros') fetchCarros(page);
                    if (viewName === 'fabricantes') fetchFabricantes(page);
                };
                container.appendChild(btn);
            };

            // Lógica simples de paginação (apenas 5 botões)
            let start = Math.max(0, currentPage - 2);
            let end = Math.min(totalPages, start + 5);
            
            if (start > 0) createBtn(0, '1..');
            for (let i = start; i < end; i++) createBtn(i, i + 1);
            if (end < totalPages) createBtn(totalPages - 1, `..${totalPages}`);
        }

        // --- 6. CACHES DE DADOS (Dropdowns) ---
        async function loadDropdownData() {
            try {
                // Carrega listas grandes para os selects
                const [carrosData, fabData] = await Promise.all([
                    apiFetch(`${API_BASE_URL}/carros?page=0&size=1000`),
                    apiFetch(`${API_BASE_URL}/fabricantes?page=0&size=1000`)
                ]);
                state.carros = carrosData.content || carrosData.Carros || [];
                state.fabricantes = fabData.content || fabData.Fabricantes || [];
            } catch (e) {
                console.warn("Erro ao carregar dropdowns:", e);
            }
        }

        // =================================================================================
        // --- MÓDULO: ACESSÓRIOS ---
        // =================================================================================

        function renderAcessoriosList(page = 0) {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="flex flex-col space-y-4">
                    <h2 class="text-2xl font-bold text-slate-800 border-b pb-2">Acessórios</h2>
                    
                    <div class="flex flex-wrap gap-2 items-end bg-gray-50 p-4 rounded-lg border">
                        <div class="flex-grow">
                            <label class="text-xs font-bold text-slate-500">Buscar</label>
                            <input type="text" id="searchQ" class="w-full p-2 border rounded" placeholder="Nome..." value="${state.search.acessorios.q}">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-500">Ordenar</label>
                            <select id="searchSort" class="p-2 border rounded">
                                <option value="id">ID</option>
                                <option value="nome">Nome</option>
                                <option value="valor">Valor</option>
                            </select>
                        </div>
                         <div>
                            <label class="text-xs font-bold text-slate-500">Direção</label>
                            <select id="searchDir" class="p-2 border rounded">
                                <option value="asc">Cresc.</option>
                                <option value="desc">Decresc.</option>
                            </select>
                        </div>
                        <button onclick="applySearchAcessorios()" class="bg-primary text-white px-4 py-2 rounded font-bold hover:bg-teal-700">Filtrar</button>
                        <button onclick="router('acessorios', 'form')" class="bg-success text-white px-4 py-2 rounded font-bold hover:bg-emerald-600 ml-auto">Novo</button>
                    </div>

                    <div id="listContainer" class="overflow-x-auto bg-white rounded shadow">
                        <div class="p-8 text-center text-gray-500">Carregando...</div>
                    </div>
                    
                    <div id="pagContainer" class="flex justify-center pt-4"></div>
                </div>
            `;
            
            // Restaura filtros salvos
            document.getElementById('searchSort').value = state.search.acessorios.sort;
            document.getElementById('searchDir').value = state.search.acessorios.direction;
            
            window.applySearchAcessorios = () => {
                state.search.acessorios.q = document.getElementById('searchQ').value;
                state.search.acessorios.sort = document.getElementById('searchSort').value;
                state.search.acessorios.direction = document.getElementById('searchDir').value;
                fetchAcessorios(0);
            };

            fetchAcessorios(page);
        }

        async function fetchAcessorios(page) {
            const { q, sort, direction } = state.search.acessorios;
            const url = `${API_BASE_URL}/acessorios/search?q=${q}&page=${page}&size=5&sort=${sort}&direction=${direction}`;
            
            try {
                const data = await apiFetch(url);
                const lista = data.Acessorios || data.content || [];
                state.totalPages = data.TotalPages || data.totalPages || 1;
                state.currentPage = page;

                const container = document.getElementById('listContainer');
                
                if(lista.length === 0) {
                    container.innerHTML = '<div class="p-8 text-center text-gray-500">Nenhum registro encontrado.</div>';
                    renderPagination('pagContainer', 'acessorios', 0, 0);
                    return;
                }

                let html = `
                    <table class="min-w-full w-full">
                        <thead>
                            <tr class="bg-gray-100 text-slate-600 text-sm uppercase text-left">
                                <th class="py-3 px-4">ID</th>
                                <th class="py-3 px-4">Nome</th>
                                <th class="py-3 px-4">Valor</th>
                                <th class="py-3 px-4">Carro</th>
                                <th class="py-3 px-4 text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody class="text-slate-700 text-sm">`;
                
                lista.forEach(item => {
                    html += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="py-3 px-4">${item.id}</td>
                            <td class="py-3 px-4 font-medium">${item.nome}</td>
                            <td class="py-3 px-4">R$ ${item.valor ? item.valor.toFixed(2) : '0.00'}</td>
                            <td class="py-3 px-4 text-xs">${item.carro ? (item.carro.modelo + ' - ' + item.carro.paisDeMontagem) : '<span class="text-gray-400">Sem vínculo</span>'}</td>
                            <td class="py-3 px-4 text-right space-x-2">
                                <button onclick="router('acessorios', 'form', ${item.id})" class="bg-warning text-white px-2 py-1 rounded text-xs hover:bg-amber-600">Editar</button>
                                <button onclick="deleteItem('acessorios', ${item.id}, fetchAcessorios)" class="bg-danger text-white px-2 py-1 rounded text-xs hover:bg-red-600">Excluir</button>
                            </td>
                        </tr>`;
                });
                
                html += `</tbody></table>`;
                container.innerHTML = html;
                renderPagination('pagContainer', 'acessorios', state.totalPages, page);

            } catch (error) {
                document.getElementById('listContainer').innerHTML = `<div class="p-4 text-red-500">Erro: ${error.message}</div>`;
            }
        }

        async function renderAcessorioForm() {
            const isEditing = state.entityId !== null;
            const content = document.getElementById('content');
            content.innerHTML = '<div class="p-8 text-center">Carregando formulário...</div>';

            // Garante que temos os dados para os selects
            await loadDropdownData();

            let data = {};
            if (isEditing) {
                try {
                    data = await apiFetch(`${API_BASE_URL}/acessorios/${state.entityId}`);
                } catch (e) {
                    showToast("Erro ao carregar dados para edição", "danger");
                    return router('acessorios');
                }
            }

            content.innerHTML = `
                <h2 class="text-2xl font-bold mb-6 border-b pb-2">${isEditing ? 'Editar' : 'Novo'} Acessório</h2>
                <form id="mainForm" class="max-w-2xl mx-auto space-y-4">
                    
                    <div>
                        <label class="block text-sm font-bold text-slate-700">Nome *</label>
                        <input type="text" name="nome" required class="w-full p-2 border rounded focus:ring-2 focus:ring-primary" value="${data.nome || ''}">
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700">Descrição *</label>
                        <textarea name="descricao" required rows="3" class="w-full p-2 border rounded focus:ring-2 focus:ring-primary">${data.descricao || ''}</textarea>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-700">Valor (R$)</label>
                            <input type="number" name="valor" step="0.01" class="w-full p-2 border rounded" value="${data.valor || ''}">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700">Ano Aquisição</label>
                            <input type="number" name="ano" class="w-full p-2 border rounded" value="${data.anoAquisicao || ''}">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700">Tempo (min)</label>
                            <input type="number" name="tempo" class="w-full p-2 border rounded" value="${data.tempoInstalacaoMinutos || ''}">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700">Carro Associado</label>
                        <select name="carroId" class="w-full p-2 border rounded bg-white">
                            <option value="">-- Selecione um Carro --</option>
                            ${state.carros.map(c => `<option value="${c.id}" ${data.carro?.id === c.id ? 'selected' : ''}>${c.modelo} (${c.paisDeMontagem})</option>`).join('')}
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700">Fabricantes (Segure Ctrl para selecionar vários)</label>
                        <select name="fabricantesIds" multiple class="w-full p-2 border rounded h-32 bg-white">
                            ${state.fabricantes.map(f => `<option value="${f.id}" ${data.fabricantes?.some(df => df.id === f.id) ? 'selected' : ''}>${f.nome}</option>`).join('')}
                        </select>
                    </div>

                    <div class="flex justify-end space-x-3 pt-4 border-t">
                        <button type="button" onclick="router('acessorios')" class="px-4 py-2 bg-gray-300 text-slate-800 rounded hover:bg-gray-400">Cancelar</button>
                        <button type="submit" class="px-4 py-2 bg-primary text-white rounded hover:bg-teal-700 font-bold">Salvar</button>
                    </div>
                </form>
            `;

            document.getElementById('mainForm').onsubmit = async (e) => {
                e.preventDefault();
                const f = e.target;
                
                const payload = {
                    nome: f.nome.value,
                    descricao: f.descricao.value,
                    valor: f.valor.value ? parseFloat(f.valor.value) : null,
                    anoAquisicao: f.ano.value ? parseInt(f.ano.value) : null,
                    tempoInstalacaoMinutos: f.tempo.value ? parseInt(f.tempo.value) : null,
                    carro: f.carroId.value ? state.carros.find(c => c.id == f.carroId.value) : null,
                    fabricantes: Array.from(f.fabricantesIds.selectedOptions).map(opt => state.fabricantes.find(fab => fab.id == opt.value))
                };

                if (isEditing) payload.id = state.entityId;

                const method = isEditing ? 'PUT' : 'POST';
                const url = isEditing ? `${API_BASE_URL}/acessorios/${state.entityId}` : `${API_BASE_URL}/acessorios`;

                try {
                    await apiFetch(url, {
                        method: method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    showToast('Salvo com sucesso!', 'success');
                    router('acessorios');
                } catch (error) {
                    showToast(error.message, 'danger');
                }
            };
        }


        // =================================================================================
        // --- MÓDULO: CARROS ---
        // =================================================================================
        
        function renderCarrosList(page = 0) {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="flex flex-col space-y-4">
                    <h2 class="text-2xl font-bold text-slate-800 border-b pb-2">Carros</h2>
                    
                    <div class="flex gap-2 mb-4">
                        <input type="text" id="searchCar" class="flex-grow p-2 border rounded" placeholder="Buscar modelo..." value="${state.search.carros.q}">
                        <button onclick="updateCarSearch()" class="bg-primary text-white px-4 py-2 rounded font-bold">Buscar</button>
                        <button onclick="router('carros', 'form')" class="bg-success text-white px-4 py-2 rounded font-bold">Novo</button>
                    </div>

                    <div id="listContainer" class="overflow-x-auto bg-white rounded shadow">Carregando...</div>
                    <div id="pagContainer" class="flex justify-center pt-4"></div>
                </div>
            `;

            window.updateCarSearch = () => {
                state.search.carros.q = document.getElementById('searchCar').value;
                fetchCarros(0);
            };
            fetchCarros(page);
        }

        async function fetchCarros(page) {
            const q = state.search.carros.q;
            const url = `${API_BASE_URL}/carros/search?q=${q}&page=${page}&size=5&sort=modelo&direction=asc`;
            
            try {
                const data = await apiFetch(url);
                const lista = data.Carros || data.content || [];
                state.totalPages = data.TotalPages || data.totalPages || 1;
                state.currentPage = page;

                const container = document.getElementById('listContainer');
                
                if(lista.length === 0) {
                    container.innerHTML = '<div class="p-8 text-center">Nada encontrado.</div>';
                    return;
                }

                let html = `<table class="min-w-full"><thead><tr class="bg-gray-100 text-left text-sm uppercase text-slate-600"><th class="p-4">Modelo</th><th class="p-4">País</th><th class="p-4">Versão</th><th class="p-4 text-right">Ações</th></tr></thead><tbody>`;
                lista.forEach(c => {
                    html += `<tr class="border-b hover:bg-gray-50">
                        <td class="p-4 font-medium">${c.modelo}</td>
                        <td class="p-4">${c.paisDeMontagem}</td>
                        <td class="p-4 text-sm text-gray-500">${c.nomeCompletoVersao || '-'}</td>
                        <td class="p-4 text-right space-x-2">
                            <button onclick="router('carros','form',${c.id})" class="bg-warning text-white px-2 py-1 rounded text-xs">Editar</button>
                            <button onclick="deleteItem('carros', ${c.id}, fetchCarros)" class="bg-danger text-white px-2 py-1 rounded text-xs">Excluir</button>
                        </td></tr>`;
                });
                container.innerHTML = html + '</tbody></table>';
                renderPagination('pagContainer', 'carros', state.totalPages, page);
            } catch(e) {
                document.getElementById('listContainer').innerHTML = `<div class="p-4 text-red-500">${e.message}</div>`;
            }
        }

        async function renderCarroForm() {
            const isEditing = state.entityId !== null;
            const content = document.getElementById('content');
            content.innerHTML = 'Carregando...';

            let data = { fichaTecnica: {} };
            if (isEditing) {
                try {
                    data = await apiFetch(`${API_BASE_URL}/carros/${state.entityId}`);
                    data.fichaTecnica = data.fichaTecnica || {};
                } catch (e) { router('carros'); return; }
            }

            content.innerHTML = `
                <h2 class="text-2xl font-bold mb-6">${isEditing ? 'Editar' : 'Novo'} Carro</h2>
                <form id="carForm" class="max-w-3xl mx-auto space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <label class="block"><span>Modelo *</span><input required name="modelo" class="w-full p-2 border rounded" value="${data.modelo||''}"></label>
                        <label class="block"><span>País de Montagem *</span><input required name="pais" class="w-full p-2 border rounded" value="${data.paisDeMontagem||''}"></label>
                        <label class="block"><span>Versão Completa</span><input name="versao" class="w-full p-2 border rounded" value="${data.nomeCompletoVersao||''}"></label>
                        <label class="block"><span>Data Fabricação</span><input type="date" name="dataFab" class="w-full p-2 border rounded" value="${formatDateForInput(data.dataDeFabricacao)}"></label>
                    </div>
                    
                    <div class="bg-slate-50 p-4 rounded border border-slate-200">
                        <h3 class="font-bold text-slate-700 mb-3">Ficha Técnica</h3>
                        <div class="space-y-3">
                            <label class="block"><span>Motor</span><input name="motor" class="w-full p-2 border rounded" value="${data.fichaTecnica.detalhesDoMotor||''}"></label>
                            <label class="block"><span>Combustível</span><input name="combustivel" class="w-full p-2 border rounded" value="${data.fichaTecnica.tipoDeCombustivel||''}"></label>
                            <label class="block"><span>Opcionais</span><textarea name="opcionais" class="w-full p-2 border rounded">${data.fichaTecnica.opcionaisDeFabrica||''}</textarea></label>
                        </div>
                    </div>

                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="router('carros')" class="px-4 py-2 bg-gray-300 rounded">Cancelar</button>
                        <button type="submit" class="px-4 py-2 bg-primary text-white rounded font-bold">Salvar</button>
                    </div>
                </form>
            `;

            document.getElementById('carForm').onsubmit = async (e) => {
                e.preventDefault();
                const f = e.target;
                const payload = {
                    modelo: f.modelo.value,
                    paisDeMontagem: f.pais.value,
                    nomeCompletoVersao: f.versao.value,
                    dataDeFabricacao: f.dataFab.value || null,
                    fichaTecnica: {
                        detalhesDoMotor: f.motor.value,
                        tipoDeCombustivel: f.combustivel.value,
                        opcionaisDeFabrica: f.opcionais.value
                    }
                };
                if (isEditing) payload.id = state.entityId;

                try {
                    await apiFetch(isEditing ? `${API_BASE_URL}/carros/${state.entityId}` : `${API_BASE_URL}/carros`, {
                        method: isEditing ? 'PUT' : 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    showToast('Salvo!', 'success');
                    router('carros');
                } catch (err) { showToast(err.message, 'danger'); }
            };
        }


        // =================================================================================
        // --- MÓDULO: FABRICANTES ---
        // =================================================================================
        
        function renderFabricantesList(page = 0) {
            const content = document.getElementById('content');
            content.innerHTML = `
                <h2 class="text-2xl font-bold mb-4 border-b pb-2">Fabricantes</h2>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="searchFab" class="flex-grow p-2 border rounded" placeholder="Nome..." value="${state.search.fabricantes.q}">
                    <button onclick="updateFabSearch()" class="bg-primary text-white px-4 py-2 rounded font-bold">Buscar</button>
                    <button onclick="router('fabricantes', 'form')" class="bg-success text-white px-4 py-2 rounded font-bold">Novo</button>
                </div>
                <div id="listContainer" class="bg-white rounded shadow">Carregando...</div>
                <div id="pagContainer" class="flex justify-center pt-4"></div>
            `;
            window.updateFabSearch = () => { state.search.fabricantes.q = document.getElementById('searchFab').value; fetchFabricantes(0); };
            fetchFabricantes(page);
        }

        async function fetchFabricantes(page) {
            const q = state.search.fabricantes.q;
            const url = `${API_BASE_URL}/fabricantes/search?q=${q}&page=${page}&size=5&sort=nome&direction=asc`;
            try {
                const data = await apiFetch(url);
                const lista = data.Fabricantes || data.content || [];
                state.totalPages = data.TotalPages || data.totalPages || 1;
                state.currentPage = page;

                const container = document.getElementById('listContainer');
                if(lista.length === 0) { container.innerHTML = '<div class="p-4 text-center">Vazio</div>'; return; }

                let html = `<table class="min-w-full"><thead><tr class="bg-gray-100 text-left text-sm uppercase text-slate-600"><th class="p-4">Nome</th><th class="p-4">Detalhes</th><th class="p-4 text-right">Ações</th></tr></thead><tbody>`;
                lista.forEach(f => {
                    html += `<tr class="border-b hover:bg-gray-50"><td class="p-4 font-medium">${f.nome}</td><td class="p-4 text-sm text-gray-500">${f.detalhes||''}</td>
                    <td class="p-4 text-right space-x-2">
                        <button onclick="router('fabricantes','form',${f.id})" class="bg-warning text-white px-2 py-1 rounded text-xs">Editar</button>
                        <button onclick="deleteItem('fabricantes', ${f.id}, fetchFabricantes)" class="bg-danger text-white px-2 py-1 rounded text-xs">Excluir</button>
                    </td></tr>`;
                });
                container.innerHTML = html + '</tbody></table>';
                renderPagination('pagContainer', 'fabricantes', state.totalPages, page);
            } catch(e) { document.getElementById('listContainer').innerHTML = `<div class="text-red-500 p-4">${e.message}</div>`; }
        }

        async function renderFabricanteForm() {
            const isEditing = state.entityId !== null;
            let data = {};
            if(isEditing) {
                try { data = await apiFetch(`${API_BASE_URL}/fabricantes/${state.entityId}`); } 
                catch(e) { router('fabricantes'); return; }
            }
            document.getElementById('content').innerHTML = `
                <h2 class="text-2xl font-bold mb-6">${isEditing?'Editar':'Novo'} Fabricante</h2>
                <form id="fabForm" class="max-w-lg mx-auto space-y-4">
                    <label class="block"><span>Nome *</span><input required name="nome" class="w-full p-2 border rounded" value="${data.nome||''}"></label>
                    <label class="block"><span>Detalhes</span><textarea name="detalhes" rows="3" class="w-full p-2 border rounded">${data.detalhes||''}</textarea></label>
                    <div class="flex justify-end space-x-3 pt-4">
                        <button type="button" onclick="router('fabricantes')" class="px-4 py-2 bg-gray-300 rounded">Cancelar</button>
                        <button type="submit" class="px-4 py-2 bg-primary text-white rounded font-bold">Salvar</button>
                    </div>
                </form>
            `;
            document.getElementById('fabForm').onsubmit = async(e) => {
                e.preventDefault();
                const payload = { nome: e.target.nome.value, detalhes: e.target.detalhes.value };
                if(isEditing) payload.id = state.entityId;
                try {
                    await apiFetch(isEditing?`${API_BASE_URL}/fabricantes/${state.entityId}`:`${API_BASE_URL}/fabricantes`, {
                        method: isEditing?'PUT':'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
                    });
                    showToast('Salvo!', 'success'); router('fabricantes');
                } catch(err) { showToast(err.message, 'danger'); }
            };
        }

        // --- FUNÇÃO DELETAR GENÉRICA ---
        function deleteItem(type, id, refreshCallback) {
            showConfirmationModal('Confirmar Exclusão', 'Tem certeza que deseja excluir este item?', async () => {
                try {
                    await apiFetch(`${API_BASE_URL}/${type}/${id}`, { method: 'DELETE' });
                    showToast('Item excluído com sucesso.', 'success');
                    refreshCallback(state.currentPage);
                } catch (error) {
                    showToast(error.message, 'danger');
                }
            });
        }

        // --- INICIALIZAÇÃO ---
        window.onload = () => router('acessorios');

    </script>
</body>
</html>
