<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Gerenciamento de Carros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#0d9488', // Teal-600
                        'secondary': '#475569', // Slate-600
                        'success': '#10b981', // Emerald-500
                        'danger': '#ef4444', // Red-500
                        'warning': '#f59e0b', // Amber-500
                        'info': '#38bdf8', // Sky-400
                        'background-light': '#f8fafc', // Slate-50
                    },
                }
            }
        }
    </script>
    <style>
        .h-32 { height: 8rem; }
        .overflow-x-auto::-webkit-scrollbar {
            height: 8px;
        }
        .overflow-x-auto::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-background-light min-h-screen text-slate-800">

    <div id="app" class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        
        <nav class="bg-white shadow-lg rounded-lg mb-8 p-4 flex flex-col sm:flex-row justify-between items-center space-y-4 sm:space-y-0 border-b-4 border-primary">
            <h1 class="text-3xl font-extrabold text-slate-800">Gerenciamento de Frota</h1>
            <div class="flex flex-wrap gap-3">
                <button onclick="router('acessorios')" class="nav-button bg-primary hover:bg-teal-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-150 shadow-md">Acessórios</button>
                <button onclick="router('carros')" class="nav-button bg-secondary hover:bg-slate-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-150 shadow-md">Carros</button>
                <button onclick="router('fabricantes')" class="nav-button bg-secondary hover:bg-slate-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-150 shadow-md">Fabricantes</button>
            </div>
        </nav>

        <main id="content" class="bg-white p-6 rounded-lg shadow-xl min-h-[60vh]">
            <div class="text-center text-slate-500 mt-20">
                Selecione uma entidade no menu acima para começar a gerenciar.
            </div>
        </main>

        <div id="custom-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 p-4">
            <div class="bg-white rounded-xl p-6 shadow-2xl w-full max-w-md">
                <h3 id="modal-title" class="text-xl font-bold mb-4 text-slate-800">Título</h3>
                <p id="modal-body" class="mb-6 text-slate-600">Corpo da mensagem.</p>
                <div id="modal-actions" class="flex justify-end space-x-3">
                    <button id="modal-cancel" class="py-2 px-4 bg-gray-300 text-slate-800 rounded-lg hover:bg-gray-400 transition font-medium">Cancelar</button>
                    <button id="modal-confirm" class="py-2 px-4 bg-danger text-white rounded-lg hover:bg-red-600 transition font-medium">Confirmar</button>
                </div>
            </div>
        </div>

        <div id="toast-container" class="fixed bottom-5 right-5 z-50 space-y-2"></div>
    </div>

    <script>
        // --- 1. CONFIGURAÇÕES GLOBAIS ---
        const API_BASE_URL = 'https://api-gerenciamentocarro-final.onrender.com/api/v1';
        const MAX_RETRIES = 2; // Reduzido para testes mais rápidos
        const state = {
            currentView: '',
            mode: 'list',
            data: null,
            entityId: null,
            currentPage: 0,
            totalPages: 1,
            carros: [],
            fabricantes: [],
            search: {
                acessorios: { q: '', sort: 'id', direction: 'asc' },
                carros: { q: '', sort: 'id', direction: 'asc' },
                fabricantes: { q: '', sort: 'id', direction: 'asc' }
            }
        };

        // --- FUNÇÃO UTILITÁRIA DE DATA ---
        // Remove a parte da hora se existir, para funcionar no input type="date"
        function formatDateForInput(dateString) {
            if (!dateString) return '';
            return dateString.split('T')[0];
        }

        // --- 2. SERVIÇO DE API ---
        async function apiFetch(url, options = {}, retries = 0) {
            try {
                const response = await fetch(url, options);
                if (response.status === 204) return null;

                const contentType = response.headers.get("content-type");
                let data = null;

                if (contentType && contentType.indexOf("application/json") !== -1) {
                    data = await response.json();
                } else if (contentType && contentType.indexOf("text/plain") !== -1) {
                    data = await response.text();
                } else {
                    data = {};
                }

                if (!response.ok) {
                    if (response.status === 409) {
                        throw new Error(typeof data === 'string' ? data : "Conflito: Item em uso por outra entidade.");
                    }
                    throw new Error(data?.message || response.statusText || "Erro desconhecido");
                }
                return data;
            } catch (error) {
                if (retries < MAX_RETRIES && options.method !== 'DELETE') { // Evita retry em DELETE perigoso
                    const delay = Math.pow(2, retries) * 300;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return apiFetch(url, options, retries + 1);
                }
                throw error;
            }
        }

        // --- 3. UI E NOTIFICAÇÕES ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const colorMap = {
                success: 'bg-success',
                danger: 'bg-danger',
                warning: 'bg-warning text-slate-900',
                info: 'bg-info'
            };
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-lg shadow-2xl text-white font-semibold ${colorMap[type]} transition-all duration-300 transform translate-x-0 opacity-100`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-full');
                toast.addEventListener('transitionend', () => toast.remove());
            }, 4000);
        }

        function showConfirmationModal(title, body, onConfirm) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').textContent = body;
            
            const confirmBtn = document.getElementById('modal-confirm');
            const cancelBtn = document.getElementById('modal-cancel');

            // Clone nodes to remove old event listeners
            const newConfirm = confirmBtn.cloneNode(true);
            const newCancel = cancelBtn.cloneNode(true);
            
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
            cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);

            newConfirm.onclick = () => {
                modal.classList.add('hidden');
                onConfirm();
            };
            newCancel.onclick = () => modal.classList.add('hidden');
            modal.classList.remove('hidden');
        }

        // --- 4. ROTEADOR ---
        function router(view, mode = 'list', id = null, page = 0) {
            state.currentView = view;
            state.mode = mode;
            state.entityId = id;
            state.currentPage = page;

            document.querySelectorAll('.nav-button').forEach(btn => {
                btn.classList.remove('bg-primary', 'hover:bg-teal-700');
                btn.classList.add('bg-secondary', 'hover:bg-slate-700');
            });
            
            // Correção do seletor do botão ativo
            const buttons = document.querySelectorAll('button[onclick^="router"]');
            buttons.forEach(btn => {
                if(btn.getAttribute('onclick').includes(`'${view}'`)) {
                    btn.classList.add('bg-primary', 'hover:bg-teal-700');
                    btn.classList.remove('bg-secondary', 'hover:bg-slate-700');
                }
            });

            switch (view) {
                case 'acessorios':
                    state.mode === 'list' ? renderAcessoriosList(page) : renderAcessorioForm();
                    break;
                case 'carros':
                    state.mode === 'list' ? renderCarrosList(page) : renderCarroForm();
                    break;
                case 'fabricantes':
                    state.mode === 'list' ? renderFabricantesList(page) : renderFabricanteForm();
                    break;
            }
        }

        // --- PAGINAÇÃO ---
        function renderPagination(containerId, viewName, totalPages, currentPage) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            
            // Limita botões se houver muitas páginas
            const start = Math.max(0, currentPage - 2);
            const end = Math.min(totalPages, start + 5);

            for (let i = start; i < end; i++) {
                const btn = document.createElement('button');
                btn.textContent = i + 1;
                btn.onclick = () => {
                    if (viewName === 'acessorios') fetchAcessorios(i);
                    else if (viewName === 'carros') fetchCarros(i);
                    else if (viewName === 'fabricantes') fetchFabricantes(i);
                };
                btn.className = `py-2 px-4 rounded-lg font-bold transition duration-150 ${i === currentPage ? 'bg-primary text-white' : 'bg-gray-200 text-slate-700 hover:bg-gray-300'}`;
                container.appendChild(btn);
            }
        }

        // --- 5. DADOS AUXILIARES (Corrigido para não usar /all) ---
        async function fetchAllCarros() {
            try {
                // CORREÇÃO: Usa paginação grande em vez de /all para garantir compatibilidade
                const data = await apiFetch(`${API_BASE_URL}/carros?page=0&size=1000`); 
                // Verifica se a API retorna {content: [...]} ou array direto ou objeto paginado {Carros: [...]}
                state.carros = data.content || data.Carros || data || [];
            } catch (error) {
                console.error(error);
                showToast("Erro ao carregar lista de Carros.", 'danger');
                state.carros = [];
            }
        }

        async function fetchAllFabricantes() {
            try {
                const data = await apiFetch(`${API_BASE_URL}/fabricantes?page=0&size=1000`);
                state.fabricantes = data.content || data.Fabricantes || data || [];
            } catch (error) {
                console.error(error);
                showToast("Erro ao carregar lista de Fabricantes.", 'danger');
                state.fabricantes = [];
            }
        }

        // --- 6. ACESSÓRIOS ---
        function renderAcessoriosList(page = 0) {
            // Configura a função global para o botão de pesquisa
            window.updateAcessorioSearchParams = (p) => {
                state.search.acessorios.q = document.getElementById('acessorioSearchInput').value;
                state.search.acessorios.sort = document.getElementById('acessorioSortSelect').value;
                state.search.acessorios.direction = document.getElementById('acessorioDirectionSelect').value;
                fetchAcessorios(p);
            };

            const content = document.getElementById('content');
            content.innerHTML = `
                <h2 class="text-3xl font-bold mb-6 text-slate-800 border-b pb-2">Lista de Acessórios</h2>
                <div class="flex flex-wrap gap-4 mb-6 items-center">
                    <input type="text" id="acessorioSearchInput" placeholder="Buscar..." class="p-3 border border-gray-300 rounded-lg flex-grow" value="${state.search.acessorios.q}">
                    <select id="acessorioSortSelect" class="p-3 border border-gray-300 rounded-lg">
                        <option value="id" ${state.search.acessorios.sort === 'id' ? 'selected' : ''}>ID</option>
                        <option value="nome" ${state.search.acessorios.sort === 'nome' ? 'selected' : ''}>Nome</option>
                        <option value="valor" ${state.search.acessorios.sort === 'valor' ? 'selected' : ''}>Valor</option>
                    </select>
                    <select id="acessorioDirectionSelect" class="p-3 border border-gray-300 rounded-lg">
                        <option value="asc" ${state.search.acessorios.direction === 'asc' ? 'selected' : ''}>Crescente</option>
                        <option value="desc" ${state.search.acessorios.direction === 'desc' ? 'selected' : ''}>Decrescente</option>
                    </select>
                    <button onclick="updateAcessorioSearchParams(0)" class="bg-primary hover:bg-teal-700 text-white font-bold py-3 px-6 rounded-lg shadow-md">Pesquisar</button>
                    <button onclick="router('acessorios', 'form')" class="bg-success hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-lg shadow-md ml-auto">Novo</button>
                </div>
                <div id="acessoriosListContainer" class="overflow-x-auto"></div>
                <div id="paginationControlsAcessorios" class="flex justify-center gap-2 mt-6"></div>
            `;

            // Bind do Enter
            document.getElementById('acessorioSearchInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') updateAcessorioSearchParams(0);
            });

            fetchAcessorios(page);
        }

        async function fetchAcessorios(page) {
            const { q, sort, direction } = state.search.acessorios;
            const listContainer = document.getElementById('acessoriosListContainer');
            
            listContainer.innerHTML = `<div class="text-center p-8 text-slate-500">Carregando...</div>`;
            state.currentPage = page;

            // Endpoint de busca
            const url = `${API_BASE_URL}/acessorios/search?q=${q}&page=${page}&size=5&sort=${sort}&direction=${direction}`;

            try {
                const data = await apiFetch(url);
                // Ajuste para aceitar tanto Maiúscula quanto minúscula da API
                const lista = data.Acessorios || data.acessorios || data.content || [];
                state.totalPages = data.TotalPages || data.totalPages || 1;

                if (lista.length === 0) {
                    listContainer.innerHTML = `<div class="text-center p-8 text-slate-500">Nenhum registro encontrado.</div>`;
                    return;
                }

                let html = `
                    <table class="min-w-full bg-white rounded-lg shadow-md">
                        <thead>
                            <tr class="bg-gray-200 text-slate-600 text-sm uppercase">
                                <th class="py-3 px-6 text-left">ID</th>
                                <th class="py-3 px-6 text-left">Nome</th>
                                <th class="py-3 px-6 text-left">Valor</th>
                                <th class="py-3 px-6 text-left">Carro</th>
                                <th class="py-3 px-6 text-left">Ações</th>
                            </tr>
                        </thead>
                        <tbody class="text-slate-600 text-sm font-light">`;
                
                lista.forEach(item => {
                    html += `
                        <tr class="border-b border-gray-200 hover:bg-gray-50">
                            <td class="py-3 px-6">${item.id}</td>
                            <td class="py-3 px-6 font-medium">${item.nome}</td>
                            <td class="py-3 px-6">R$ ${item.valor ? item.valor.toFixed(2) : '0.00'}</td>
                            <td class="py-3 px-6">${item.carro?.modelo || '-'}</td>
                            <td class="py-3 px-6 flex space-x-2">
                                <button onclick="router('acessorios', 'form', ${item.id})" class="bg-warning hover:bg-amber-600 text-white font-bold py-1 px-3 rounded text-xs">Editar</button>
                                <button onclick="handleAcessorioDelete(${item.id})" class="bg-danger hover:bg-red-600 text-white font-bold py-1 px-3 rounded text-xs">Excluir</button>
                            </td>
                        </tr>`;
                });
                html += `</tbody></table>`;
                listContainer.innerHTML = html;
                renderPagination('paginationControlsAcessorios', 'acessorios', state.totalPages, state.currentPage);

            } catch (error) {
                listContainer.innerHTML = `<div class="text-center p-8 text-danger">Erro: ${error.message}</div>`;
            }
        }

        async function renderAcessorioForm() {
            const isEditing = state.entityId !== null;
            const content = document.getElementById('content');
            content.innerHTML = `<div class="text-center p-8 text-slate-500">Carregando formulário...</div>`;

            await Promise.all([fetchAllCarros(), fetchAllFabricantes()]);

            let initialData = {};
            if (isEditing) {
                try {
                    initialData = await apiFetch(`${API_BASE_URL}/acessorios/${state.entityId}`);
                } catch (e) {
                    showToast("Erro ao carregar dados.", 'danger');
                    return router('acessorios');
                }
            }

            // Render do Formulário (Mantido similar, apenas garantindo ids únicos e selects seguros)
            content.innerHTML = `
                <h2 class="text-3xl font-bold mb-6 text-slate-800 border-b pb-2">${isEditing ? 'Editar' : 'Novo'} Acessório</h2>
                <form id="acessorioForm" class="space-y-4 max-w-2xl mx-auto">
                    <label class="block">
                        <span class="text-slate-700">Nome *</span>
                        <input type="text" id="nome" required class="mt-1 block w-full p-2 border rounded-lg" value="${initialData.nome || ''}">
                    </label>
                    <label class="block">
                        <span class="text-slate-700">Descrição *</span>
                        <textarea id="descricao" required rows="3" class="mt-1 block w-full p-2 border rounded-lg">${initialData.descricao || ''}</textarea>
                    </label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="block">
                            <span class="text-slate-700">Ano Aquisição</span>
                            <input type="number" id="anoAquisicao" min="1900" class="mt-1 block w-full p-2 border rounded-lg" value="${initialData.anoAquisicao || ''}">
                        </label>
                        <label class="block">
                            <span class="text-slate-700">Valor (R$)</span>
                            <input type="number" id="valor" step="0.01" class="mt-1 block w-full p-2 border rounded-lg" value="${initialData.valor || ''}">
                        </label>
                    </div>
                    <label class="block">
                        <span class="text-slate-700">Tempo Instalação (min)</span>
                        <input type="number" id="tempoInstalacaoMinutos" class="mt-1 block w-full p-2 border rounded-lg" value="${initialData.tempoInstalacaoMinutos || ''}">
                    </label>
                    
                    <label class="block">
                        <span class="text-slate-700">Carro Associado</span>
                        <select id="carroSelect" class="mt-1 block w-full p-2 border rounded-lg">
                            <option value="">Nenhum</option>
                            ${state.carros.map(c => `
                                <option value="${c.id}" ${initialData.carro?.id === c.id ? 'selected' : ''}>
                                    ${c.modelo} (${c.paisDeMontagem})
                                </option>`).join('')}
                        </select>
                    </label>

                    <label class="block">
                        <span class="text-slate-700">Fabricantes (Segure Ctrl para múltiplos)</span>
                        <select id="fabricantesSelect" multiple size="4" class="mt-1 block w-full p-2 border rounded-lg h-32">
                            ${state.fabricantes.map(f => `
                                <option value="${f.id}" ${initialData.fabricantes?.some(ef => ef.id === f.id) ? 'selected' : ''}>
                                    ${f.nome}
                                </option>`).join('')}
                        </select>
                    </label>

                    <div class="flex justify-end space-x-3 pt-4">
                        <button type="button" onclick="router('acessorios')" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg">Cancelar</button>
                        <button type="submit" class="bg-primary hover:bg-teal-700 text-white font-bold py-2 px-4 rounded-lg">Salvar</button>
                    </div>
                </form>
            `;

            document.getElementById('acessorioForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const form = e.target;
                
                // Montagem do Payload
                const fabricanteIds = Array.from(form.fabricantesSelect.selectedOptions).map(o => parseInt(o.value));
                const carroId = form.carroSelect.value;
                
                const payload = {
                    nome: form.nome.value,
                    descricao: form.descricao.value,
                    anoAquisicao: form.anoAquisicao.value ? parseInt(form.anoAquisicao.value) : null,
                    valor: form.valor.value ? parseFloat(form.valor.value) : null,
                    tempoInstalacaoMinutos: form.tempoInstalacaoMinutos.value ? parseInt(form.tempoInstalacaoMinutos.value) : null,
                    carro: carroId ? state.carros.find(c => c.id == carroId) : null,
                    fabricantes: state.fabricantes.filter(f => fabricanteIds.includes(f.id))
                };
                
                if(isEditing) payload.id = state.entityId; // Alguns backends exigem o ID no body

                const url = isEditing ? `${API_BASE_URL}/acessorios/${state.entityId}` : `${API_BASE_URL}/acessorios`;
                const method = isEditing ? 'PUT' : 'POST';

                try {
                    await apiFetch(url, {
                        method: method,
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(payload)
                    });
                    showToast("Salvo com sucesso!", 'success');
                    router('acessorios');
                } catch (err) {
                    showToast("Erro ao salvar: " + err.message, 'danger');
                }
            });
        }

        function handleAcessorioDelete(id) {
            showConfirmationModal('Excluir Acessório', 'Tem certeza?', async () => {
                try {
                    await apiFetch(`${API_BASE_URL}/acessorios/${id}`, { method: 'DELETE' });
                    showToast("Excluído!", 'success');
                    fetchAcessorios(state.currentPage);
                } catch (err) {
                    showToast("Erro ao excluir: " + err.message, 'danger');
                }
            });
        }

        // --- 7. CARROS (Adaptação Simplificada) ---
        function renderCarrosList(page = 0) {
            window.updateCarroSearchParams = (p) => {
                state.search.carros.q = document.getElementById('carroSearchInput').value;
                fetchCarros(p);
            };

            const content = document.getElementById('content');
            content.innerHTML = `
                <h2 class="text-3xl font-bold mb-6 text-slate-800 border-b pb-2">Carros</h2>
                <div class="flex gap-4 mb-6">
                    <input type="text" id="carroSearchInput" placeholder="Modelo..." class="p-3 border rounded-lg flex-grow" value="${state.search.carros.q}">
                    <button onclick="updateCarroSearchParams(0)" class="bg-primary text-white px-6 rounded-lg font-bold">Buscar</button>
                    <button onclick="router('carros', 'form')" class="bg-success text-white px-6 rounded-lg font-bold ml-auto">Novo</button>
                </div>
                <div id="carrosListContainer"></div>
                <div id="paginationControlsCarros" class="flex justify-center gap-2 mt-6"></div>
            `;
            fetchCarros(page);
        }

        async function fetchCarros(page) {
            const q = state.search.carros.q;
            const url = `${API_BASE_URL}/carros/search?q=${q}&page=${page}&size=5&sort=modelo&direction=asc`;
            const container = document.getElementById('carrosListContainer');
            container.innerHTML = 'Carregando...';

            try {
                const data = await apiFetch(url);
                const lista = data.Carros || data.content || [];
                state.totalPages = data.TotalPages || data.totalPages || 1;

                if(lista.length === 0) {
                    container.innerHTML = 'Nenhum carro encontrado.';
                    return;
                }

                let html = `<table class="min-w-full bg-white shadow-md rounded-lg">
                    <thead><tr class="bg-gray-200 text-sm text-slate-600 uppercase"><th class="p-3 text-left">Modelo</th><th class="p-3 text-left">País</th><th class="p-3 text-left">Ações</th></tr></thead><tbody>`;
                
                lista.forEach(c => {
                    html += `<tr class="border-b hover:bg-gray-50">
                        <td class="p-3">${c.modelo}</td>
                        <td class="p-3">${c.paisDeMontagem}</td>
                        <td class="p-3 flex gap-2">
                            <button onclick="router('carros','form',${c.id})" class="bg-warning text-white px-2 py-1 rounded text-xs">Editar</button>
                            <button onclick="handleCarroDelete(${c.id})" class="bg-danger text-white px-2 py-1 rounded text-xs">Excluir</button>
                        </td></tr>`;
                });
                html += '</tbody></table>';
                container.innerHTML = html;
                renderPagination('paginationControlsCarros', 'carros', state.totalPages, page);
            } catch (err) {
                container.innerHTML = 'Erro ao buscar carros.';
            }
        }

        async function renderCarroForm() {
            const isEditing = state.entityId !== null;
            const content = document.getElementById('content');
            content.innerHTML = 'Carregando...';

            let data = { fichaTecnica: {} };
            if(isEditing) {
                try {
                    data = await apiFetch(`${API_BASE_URL}/carros/${state.entityId}`);
                    data.fichaTecnica = data.fichaTecnica || {};
                } catch(e) { router('carros'); return; }
            }

            content.innerHTML = `
                <h2 class="text-3xl font-bold mb-6">${isEditing ? 'Editar' : 'Novo'} Carro</h2>
                <form id="carroForm" class="space-y-4 max-w-3xl mx-auto">
                    <div class="grid grid-cols-2 gap-4">
                        <label class="block"><span>Modelo *</span><input type="text" name="modelo" required class="w-full p-2 border rounded" value="${data.modelo||''}"></label>
                        <label class="block"><span>País *</span><input type="text" name="pais" required class="w-full p-2 border rounded" value="${data.paisDeMontagem||''}"></label>
                        <label class="block"><span>Versão Completa</span><input type="text" name="versao" class="w-full p-2 border rounded" value="${data.nomeCompletoVersao||''}"></label>
                        <label class="block"><span>Data Fabricação</span><input type="date" name="dataFab" class="w-full p-2 border rounded" value="${formatDateForInput(data.dataDeFabricacao)}"></label>
                    </div>
                    <div class="bg-gray-50 p-4 rounded border">
                        <h3 class="font-bold mb-2">Ficha Técnica</h3>
                        <label class="block mb-2"><span>Motor</span><input type="text" name="motor" class="w-full p-2 border rounded" value="${data.fichaTecnica.detalhesDoMotor||''}"></label>
                        <label class="block mb-2"><span>Combustível</span><input type="text" name="combustivel" class="w-full p-2 border rounded" value="${data.fichaTecnica.tipoDeCombustivel||''}"></label>
                        <label class="block"><span>Opcionais</span><textarea name="opcionais" class="w-full p-2 border rounded">${data.fichaTecnica.opcionaisDeFabrica||''}</textarea></label>
                    </div>
                    <div class="flex justify-end gap-2">
                        <button type="button" onclick="router('carros')" class="bg-gray-400 text-white px-4 py-2 rounded">Cancelar</button>
                        <button type="submit" class="bg-primary text-white px-4 py-2 rounded">Salvar</button>
                    </div>
                </form>
            `;

            document.getElementById('carroForm').onsubmit = async (e) => {
                e.preventDefault();
                const f = e.target;
                const payload = {
                    modelo: f.modelo.value,
                    paisDeMontagem: f.pais.value,
                    nomeCompletoVersao: f.versao.value,
                    dataDeFabricacao: f.dataFab.value || null,
                    fichaTecnica: {
                        detalhesDoMotor: f.motor.value,
                        tipoDeCombustivel: f.combustivel.value,
                        opcionaisDeFabrica: f.opcionais.value
                    }
                };
                if(isEditing) payload.id = state.entityId;

                try {
                    await apiFetch(isEditing ? `${API_BASE_URL}/carros/${state.entityId}` : `${API_BASE_URL}/carros`, {
                        method: isEditing ? 'PUT' : 'POST',
                        headers: {'Content-Type':'application/json'},
                        body: JSON.stringify(payload)
                    });
                    showToast('Sucesso!', 'success');
                    router('carros');
                } catch(err) { showToast(err.message, 'danger'); }
            };
        }

        function handleCarroDelete(id) {
             showConfirmationModal('Excluir Carro', 'Isso pode falhar se houver acessórios vinculados.', async () => {
                try {
                    await apiFetch(`${API_BASE_URL}/carros/${id}`, { method: 'DELETE' });
                    showToast("Excluído!", 'success');
                    fetchCarros(state.currentPage);
                } catch (err) {
                    showToast(err.message, 'danger'); // Mostra erro 409 se houver
                }
            });
        }

        // --- 8. FABRICANTES (Mantido estrutura similar) ---
        function renderFabricantesList(page = 0) {
            window.updateFabricanteSearchParams = (p) => {
                state.search.fabricantes.q = document.getElementById('fabSearchInput').value;
                fetchFabricantes(p);
            };
            document.getElementById('content').innerHTML = `
                <h2 class="text-3xl font-bold mb-6 text-slate-800 border-b pb-2">Fabricantes</h2>
                <div class="flex gap-4 mb-6">
                    <input type="text" id="fabSearchInput" placeholder="Nome..." class="p-3 border rounded-lg flex-grow" value="${state.search.fabricantes.q}">
                    <button onclick="updateFabricanteSearchParams(0)" class="bg-primary text-white px-6 rounded-lg font-bold">Buscar</button>
                    <button onclick="router('fabricantes', 'form')" class="bg-success text-white px-6 rounded-lg font-bold ml-auto">Novo</button>
                </div>
                <div id="fabListContainer"></div>
                <div id="paginationControlsFabricantes" class="flex justify-center gap-2 mt-6"></div>
            `;
            fetchFabricantes(page);
        }

        async function fetchFabricantes(page) {
            const q = state.search.fabricantes.q;
            const url = `${API_BASE_URL}/fabricantes/search?q=${q}&page=${page}&size=5&sort=nome&direction=asc`;
            const container = document.getElementById('fabListContainer');
            
            try {
                const data = await apiFetch(url);
                const lista = data.Fabricantes || data.content || [];
                state.totalPages = data.TotalPages || data.totalPages || 1;

                if(lista.length === 0) { container.innerHTML = 'Nada encontrado.'; return; }

                let html = `<table class="min-w-full bg-white rounded shadow"><thead><tr class="bg-gray-200 text-slate-600 uppercase text-sm"><th class="p-3 text-left">Nome</th><th class="p-3 text-left">Detalhes</th><th class="p-3 text-left">Ações</th></tr></thead><tbody>`;
                lista.forEach(f => {
                    html += `<tr class="border-b hover:bg-gray-50"><td class="p-3">${f.nome}</td><td class="p-3">${f.detalhes||'-'}</td>
                    <td class="p-3 flex gap-2">
                        <button onclick="router('fabricantes','form',${f.id})" class="bg-warning text-white px-2 py-1 rounded text-xs">Editar</button>
                        <button onclick="handleFabricanteDelete(${f.id})" class="bg-danger text-white px-2 py-1 rounded text-xs">Excluir</button>
                    </td></tr>`;
                });
                container.innerHTML = html + '</tbody></table>';
                renderPagination('paginationControlsFabricantes', 'fabricantes', state.totalPages, page);
            } catch(e) { container.innerHTML = 'Erro ao carregar.'; }
        }

        async function renderFabricanteForm() {
            const isEditing = state.entityId !== null;
            let data = {};
            if(isEditing) {
                try { data = await apiFetch(`${API_BASE_URL}/fabricantes/${state.entityId}`); } 
                catch(e) { router('fabricantes'); return; }
            }
            document.getElementById('content').innerHTML = `
                <h2 class="text-3xl font-bold mb-6">${isEditing?'Editar':'Novo'} Fabricante</h2>
                <form id="fabForm" class="max-w-lg mx-auto space-y-4">
                    <label class="block"><span>Nome *</span><input required name="nome" class="w-full p-2 border rounded" value="${data.nome||''}"></label>
                    <label class="block"><span>Detalhes</span><textarea name="detalhes" class="w-full p-2 border rounded">${data.detalhes||''}</textarea></label>
                    <div class="flex justify-end gap-2 pt-4">
                        <button type="button" onclick="router('fabricantes')" class="bg-gray-400 text-white px-4 py-2 rounded">Cancelar</button>
                        <button type="submit" class="bg-primary text-white px-4 py-2 rounded">Salvar</button>
                    </div>
                </form>
            `;
            document.getElementById('fabForm').onsubmit = async(e) => {
                e.preventDefault();
                const payload = { nome: e.target.nome.value, detalhes: e.target.detalhes.value };
                if(isEditing) payload.id = state.entityId;
                try {
                    await apiFetch(isEditing?`${API_BASE_URL}/fabricantes/${state.entityId}`:`${API_BASE_URL}/fabricantes`, {
                        method: isEditing?'PUT':'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
                    });
                    showToast('Salvo!', 'success'); router('fabricantes');
                } catch(err) { showToast(err.message, 'danger'); }
            };
        }

        function handleFabricanteDelete(id) {
            showConfirmationModal('Excluir', 'Confirmar?', async() => {
                try { await apiFetch(`${API_BASE_URL}/fabricantes/${id}`, {method:'DELETE'}); showToast('Excluído','success'); fetchFabricantes(state.currentPage); }
                catch(e) { showToast(e.message, 'danger'); }
            });
        }

        // --- INICIALIZAÇÃO ---
        window.onload = () => router('acessorios');
    </script>
</body>
</html>
